# league-chat-tmpfiles.conf — чистка вложений чата «Лиги» силами systemd.
#
# Почему файлом, а не кодом в приёмнике: удаление по возрасту — ровно та работа,
# для которой в системе уже есть демон и таймер. Свой обход каталога означал бы
# второй планировщик, который надо не забыть завести, не уронить и не запустить
# дважды по одному пути. Здесь этого нет — три строки, и чистка живёт вне
# процесса приёмника, то есть переживает его перезапуски и падения.
#
# Каталогов ТРИ, и у каждого свой срок, потому что вложения бывают трёх видов:
#   att/    картинки          30 суток   (проверены сигнатурой webp)
#   voice/  голосовые         7 суток    (звук весит на порядки больше текста)
#   files/  любые небольшие   30 суток   (markdown, скиллы, конфиги)
# Разные сроки — единственная причина, по которой каталоги разные: tmpfiles умеет
# срок только на путь целиком, поэтому в общей куче пришлось бы выбирать между
# «месяц голосовых на диске» и «картинки, живущие неделю».
#
# Журнал сообщений (chat.ndjson) сюда НЕ входит: он самообрезается до последних
# 1000 сообщений самим приёмником. Расти без предела умеют только вложения.
#
# Следствие, о котором надо знать клиенту: сообщение в журнале МОЖЕТ пережить своё
# вложение — если за срок хранения в чате набралось меньше 1000 сообщений. Тогда
# /chat/att/<seq>.<ext> отдаст 404, и это нормальная ситуация, а не поломка; у звука это
# случается вчетверо чаще (7 суток против 30). Дашборд обязан выдержать это битой
# картинкой и мёртвым плеером, а не пустым экраном.
#
# ── Куда положить (на ноде, от root) ─────────────────────────────────────────
#   install -m 0644 /opt/league/league-chat-tmpfiles.conf \
#           /etc/tmpfiles.d/league-chat.conf
#   systemd-tmpfiles --clean /etc/tmpfiles.d/league-chat.conf    # прогнать сразу
#
# Имя в /etc/tmpfiles.d/ обязано кончаться на .conf — иначе файл просто не читают.
#
# ⚠ Путь в строке — абсолютный, переменных tmpfiles не понимает. Он рассчитан на
# каталог данных DATA=/opt/league. Сверить с живым юнитом ПЕРЕД установкой:
#   systemctl cat league-receiver | grep -E 'Environment|ExecStart'
# Другой DATA → поправить путь, иначе чистка будет молча гладить пустоту.
#
# ── Проверить, что чистка вообще случится ────────────────────────────────────
#   systemctl is-enabled systemd-tmpfiles-clean.timer    # ждём static или enabled
#   systemctl list-timers systemd-tmpfiles-clean.timer   # когда следующий прогон
# Таймер в systemd штатный (раз в сутки), но в урезанных образах его маскируют.
# Если вывод masked или disabled — включает ВЛАДЕЛЕЦ, руками:
#   systemctl enable --now systemd-tmpfiles-clean.timer
# Своего таймера этот файл не заводит намеренно: два планировщика на один каталог —
# способ однажды удалить лишнее и не понять, кто это сделал.
#
# Посмотреть, что именно снесётся, до удаления (systemd ≥ 256):
#   systemd-tmpfiles --clean --dry-run /etc/tmpfiles.d/league-chat.conf
# Версия старше — вместо прогона просто список: ls -la --time-style=long-iso /opt/league/att
# Чистить нужно от root: у обычного пользователя обход каталога сам двигает atime.
#
# ── Что делает строка ───────────────────────────────────────────────────────
#   e       — работать с УЖЕ существующим каталогом. Создаёт его сам приёмник
#             (fs.mkdirSync), и спорить с ним о правах и владельце незачем.
#             Тип d каталог создаёт — при опечатке в пути он бы наплодил пустышек.
#   - - -   — режим, владельца и группу не трогаем.
#   30d     — удалять СОДЕРЖИМОЕ старше 30 суток, сам каталог остаётся.
#   m:7d    — то же, но возраст считается ТОЛЬКО по времени модификации.
#
# Возраст по умолчанию считается по самой свежей из меток atime/btime/ctime/mtime,
# поэтому часто читаемое вложение переживает срок. Для звука и файлов это закрыто
# префиксом `m:` в их строках ниже; у картинок префикса нет намеренно — строка стоит на
# ноде с прежнего выката и работает на любой версии systemd.

# 🪤 Путь обязан совпадать с DATA из юнита: вложения лежат в <DATA>/att, <DATA>/voice и
# <DATA>/files, а DATA задан в league-receiver.service. Разъедется — чистка будет исправно
# удалять НОЛЬ файлов, и узнать об этом будет неоткуда. Проверить одной командой:
#   systemctl cat league-receiver | grep DATA
# Строка картинок идёт ПЕРВОЙ намеренно: выкат (tools/deploy-league-receiver.js) читает из
# этого файла первое правило и сверяет его с <DATA>/att.
e /opt/league/data/att - - - 30d

# 🔴 У звука и файлов префикс `m:` — возраст по времени МОДИФИКАЦИИ, а не по последнему
# обращению. Без него любое прослушивание голосового обновляет atime, и файл не старится
# никогда: у tmpfiles по умолчанию берётся самая свежая из меток atime/btime/ctime/mtime.
# Требует systemd ≥ 248 (проверить: systemd-tmpfiles --version). На более старой версии
# такая строка не парсится — тогда эти два каталога не чистятся вовсе, а картинки выше
# продолжают чиститься: правила независимы, и ошибка в одном не отменяет остальные.
# Увидеть это можно сразу на выкате: он печатает `systemd-tmpfiles --clean --dry-run`.
e /opt/league/data/voice - - - m:7d
e /opt/league/data/files - - - m:30d
